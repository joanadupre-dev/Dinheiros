// ── projection ────────────────────────────────────────────────────────────────
const project=(all,m,y)=>{
  const out=[];
  for(const e of all){
    const oM=e.oM!=null?e.oM:DM,oY=e.oY!=null?e.oY:DY;
    const delta=(y-oY)*12+(m-oM);
    if(e.type==='once'){if(oM===m&&oY===y)out.push(e);}
    else if(e.type==='recurring'){if(delta>=0){const pastEnd=e.endM!=null&&(y>e.endY||(y===e.endY&&m>e.endM));if(!pastEnd)out.push({...e,_pm:m,_py:y});}}
    else if(e.type==='installment'){const ni=(e.iC||1)+delta;if(delta>=0&&ni<=(e.iT||1))out.push({...e,_pm:m,_py:y,_ni:ni});}
  }
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
};

          NUMS.flat().map(n=>h('button',{key:n,onClick:()=>numpad(n),style:{background:n==='⌫'?T.redL:'#f8fffe',color:n==='⌫'?T.red:T.text,border:'1px solid '+T.border,borderRadius:14,padding:'16px 0',fontSize:20,fontWeight:700,fontFamily:'Montserrat,sans-serif',cursor:'pointer'}},n))
        ),

            )
          )
        ),
        h('div',{style:{display:'flex',gap:10}},

            const d=new Date(form.date+'T12:00:00');
            const refundAmt=amt; // sempre passa valor total; handleAdd/gfOwes divide se necessário
            const rcvType=form.rcvType||'pix_outro';
            onSave({isRefund:true,rcvType,id:uid(),name:form.name.trim(),amount:refundAmt,split:form.split||'mine',date:form.date,oM:d.getMonth(),oY:d.getFullYear(),isEstorno:rcvType==='estorno',isPixLuisa:rcvType==='pix_luisa'});
            handleClose();
          },style:{flex:2,padding:'14px',fontSize:15}},'✓ Confirmar')
        )

  const stepFns={0:steps[0],11:steps[1],12:steps[2],1:steps[3],2:steps[4],3:steps[5],4:steps[6],5:steps[7],6:steps[8],10:steps[9]};

  return h(BottomSheet,{show,onClose:handleClose,title:'➕ Novo lançamento'},
    stepFns[step]?stepFns[step]():null
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(()=>load()||makeDefaults());
  const upd=useCallback(fn=>setData(d=>{const nd=fn(JSON.parse(JSON.stringify(d)));save(nd);return nd;}),[]);
  useEffect(()=>save(data),[data]);

  const [tab,setTab]=useState('dashboard');
  const [selM,setSelM]=useState(DM);
  const [selY,setSelY]=useState(DY);
  const [showAdd,setShowAdd]=useState(false);
  const [searchQ,setSearchQ]=useState('');
  const [showMetaForm,setShowMetaForm]=useState(null); // catId or 'total'
  const [metaVal,setMetaVal]=useState('');
  const [histTab,setHistTab]=useState('categorias');
  const [editingExp,setEditingExp]=useState(null);
  const [editingRefund,setEditingRefund]=useState(null);
  const [editRefundForm,setEditRefundForm]=useState({name:'',amount:''}); // expense being edited
  const [editForm,setEditForm]=useState({});
  const [showGoal,setShowGoal]=useState(null);
  const [showClosing,setShowClosing]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [showCatForm,setShowCatForm]=useState(false);
  const [editCat,setEditCat]=useState(null);
  const [showPayConfirm,setShowPayConfirm]=useState(null);
  const [showFaturaPay,setShowFaturaPay]=useState(false);
  const [faturaPayments,setFaturaPayments]=useState([{name:'C6',value:''},{name:'XP',value:''}]);
  const [showAlert,setShowAlert]=useState(null);
  const [goalVal,setGoalVal]=useState('');
  const [closingNote,setClosingNote]=useState('');
  const [catForm,setCatForm]=useState({label:'',icon:'📦',color:'#10b981'});
  const [settings,setSettings]=useState({salary:data.salary,va:data.va,balanceDebit:data.balanceDebit,balanceVA:data.balanceVA});
  const [payRealAmt,setPayRealAmt]=useState('');

  const allCats=useMemo(()=>data.cats||DEFAULT_CATS,[data.cats]);
  const salN=parseFloat(data.salary)||0;
  const vaN=parseFloat(data.va)||0;
  const myCost=e=>e.amount; // you pay everything, luisa reimburses you separately

  const mExp=useMemo(()=>project(data.expenses,selM,selY),[data.expenses,selM,selY]);
  const mRcv=useMemo(()=>project(data.receivables||[],selM,selY),[data.receivables,selM,selY]);
  const mRefunds=useMemo(()=>(data.refunds||[]).filter(r=>r.oM===selM&&r.oY===selY),[data.refunds,selM,selY]);

  const payKey=(e)=>`${e.id}:${selM}:${selY}`;
  const isPaid=(e)=>!!(data.payments||{})[payKey(e)];
  const getPayment=(e)=>(data.payments||{})[payKey(e)];
  const realAmt=(e)=>{const p=getPayment(e);return p&&p.realAmount!=null?p.realAmount:myCost(e);};

  // split by payment type
  const creditExp=mExp.filter(e=>e.payType===PT_CREDIT&&e.split!=='luisa_pagou');
  const debitExp=mExp.filter(e=>(e.payType===PT_DEBIT||e.payType===PT_ESTIMATED)&&e.split!=='luisa_pagou'&&e.split!=='100pct_joana');
  const vaExp=mExp.filter(e=>e.payType===PT_VA);

  const totalRcv=useMemo(()=>mRcv.reduce((s,r)=>s+r.amount,0),[mRcv]);
  const totalRefunds=useMemo(()=>mRefunds.reduce((s,r)=>s+r.amount,0),[mRefunds]);

  // my costs
  const creditTotal=useMemo(()=>creditExp.reduce((s,e)=>s+myCost(e),0),[creditExp]);
  // debitTotal: paid items use realAmount, unpaid use estimated amount
  const debitTotal=useMemo(()=>debitExp.reduce((s,e)=>{
    if(e.payType===PT_ESTIMATED&&!isPaid(e))return s+myCost(e); // estimado pendente: usa valor estimado
    if(e.payType===PT_ESTIMATED&&isPaid(e))return s+realAmt(e); // estimado pago: usa valor real
    return s+myCost(e); // débito normal
  },0),[debitExp,data.payments,selM,selY]);
  const vaTotal=useMemo(()=>vaExp.reduce((s,e)=>s+myCost(e),0),[vaExp]);

  // balances
  const balDebit=parseFloat(data.balanceDebit)||0;
  const balVA=parseFloat(data.balanceVA)||0;
  const currentDebitBal=balDebit;
  const currentVABal=balVA;

  // gfOwes: everything Joana paid for Luisa (credit + estimated/debit)
  // For paid estimated items: use the real amount paid; for credit/unpaid: use e.amount
  const gfOwes=useMemo(()=>mExp.filter(e=>e.split==='divisivel'||e.split==='mine_div'||e.split==='100pct_dela').reduce((s,e)=>{
    // estorno negativo: abate o gfOwes
    if(e.amount<0) return s+(e.split==='100pct_dela'?e.amount:e.amount/2);
    let v=e.amount;
    if((e.payType===PT_ESTIMATED||e.payType===PT_DEBIT)&&isPaid(e)) v=realAmt(e);
    else if(e.payType===PT_ESTIMATED&&!isPaid(e)) v=e.amount;
    // mine_div e divisivel: Luisa deve metade; 100pct_dela: Luisa deve tudo
    return s+(e.split==='100pct_dela'?v:v/2);
  },0),[mExp,data.payments,selM,selY]);
  // joanaOwes: what Joana owes Luisa (Luisa paid those)
  const joanaOwes=useMemo(()=>mExp.filter(e=>(e.split==='luisa_pagou'||e.split==='100pct_joana')&&e.amount>0).reduce((s,e)=>s+(e.split==='luisa_pagou'?e.amount/2:e.amount),0),[mExp]);
  // Net after offset: positive = Luisa pays Joana, negative = Joana pays Luisa
  const casinhaNet=gfOwes-joanaOwes;
  // Fatura fechada vs aberta
  const faturaKey=`${selM}:${selY}`;
  const faturaFechada=(data.closedFaturas||{})[faturaKey];
  const faturaTotal=faturaFechada?faturaFechada.total:creditExp.reduce((s,e)=>s+e.amount,0);
  const faturaStatus=faturaFechada?'fechada':'aberta';

  // Confirmed receivables
  const isRcvConfirmed=(id)=>!!(data.confirmedRcv||{})[`${id}:${selM}:${selY}`];
  const confirmedRcvTotal=useMemo(()=>
    mRcv.filter(r=>isRcvConfirmed(r.id)).reduce((s,r)=>s+r.amount,0)
  ,[data.confirmedRcv,mRcv,selM,selY]);

  // Pix da Luisa no mês — abate do casinhaNet
  const pixLuisaMes=useMemo(()=>(data.refunds||[]).filter(r=>r.oM===selM&&r.oY===selY&&(r.isPixLuisa||r.rcvType==='pix_luisa')).reduce((s,r)=>s+r.amount,0),[data.refunds,selM,selY]);
  // Estornos 50/50: o valor já está salvo como metade (refundAmt=amt/2 no wizard)
  // então abate diretamente do casinhaNet como pagamento parcial da Luisa
  const estorno5050Mes=useMemo(()=>(data.refunds||[]).filter(r=>r.oM===selM&&r.oY===selY&&r.isEstorno&&r.split==='divisivel').reduce((s,r)=>s+r.amount,0),[data.refunds,selM,selY]);
  const casinhaNetPendente=casinhaNet-pixLuisaMes-estorno5050Mes;

  // next month projection
  const nextM=(selM+1)%12, nextY=selM===11?selY+1:selY;
  const nextExp=useMemo(()=>project(data.expenses,nextM,nextY),[data.expenses,nextM,nextY]);
  const nextRcv=useMemo(()=>project(data.receivables||[],nextM,nextY),[data.receivables,nextM,nextY]);
  const nextCreditTotal=useMemo(()=>nextExp.filter(e=>e.payType===PT_CREDIT).reduce((s,e)=>s+myCost(e),0),[nextExp]);
  const nextDebitTotal=useMemo(()=>nextExp.filter(e=>(e.payType===PT_DEBIT||e.payType===PT_ESTIMATED)&&e.split!=='luisa_pagou'&&e.split!=='100pct_joana').reduce((s,e)=>s+myCost(e),0),[nextExp]);
  const nextRcvTotal=useMemo(()=>nextRcv.reduce((s,r)=>s+r.amount,0),[nextRcv]);
  // Confirmed vs pending receivables this month
  const pendingRcvTotal=useMemo(()=>mRcv.filter(r=>!isRcvConfirmed(r.id)).reduce((s,r)=>s+r.amount,0),[mRcv,data.confirmedRcv,selM,selY]);
  // estimados deste mês: pagos usam realAmt, não-pagos usam estimado (todos vencem no próximo mês)
  const paidEstimatedTotal=useMemo(()=>debitExp.filter(e=>e.payType===PT_ESTIMATED&&isPaid(e)).reduce((s,e)=>s+realAmt(e),0),[debitExp,data.payments,selM,selY]);
  const unpaidEstimatedTotal=useMemo(()=>debitExp.filter(e=>e.payType===PT_ESTIMATED&&!isPaid(e)).reduce((s,e)=>s+myCost(e),0),[debitExp,data.payments,selM,selY]);
  // next month: salary + receivables - fatura atual - estimados deste mês - debit next month
  const nextAvail=balDebit+salN+casinhaNetPendente;
  const nextTotal=faturaTotal+unpaidEstimatedTotal; // pagos já saíram do saldo, não contam de novo // fatura de agora + débitos do próximo mês
  const nextGap=nextAvail-nextTotal;

  const byCategory=useMemo(()=>{
    const map={};
    for(const e of mExp){const c=myCost(e);map[e.category]=(map[e.category]||0)+c;}
    return allCats.map(c=>({...c,total:map[c.id]||0})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  },[mExp,allCats]);
  const totalMy=useMemo(()=>mExp.reduce((s,e)=>s+myCost(e),0),[mExp]);
  const getGoal=cid=>(data.goals||{})[`${cid}:${selM}:${selY}`]||0;
  const getTotalGoal=()=>(data.goals||{})[`total:${selM}:${selY}`]||0;
  const saveMetaGoal=(key)=>{
    upd(d=>{if(!d.goals)d.goals={};d.goals[key]=parseFloat(metaVal)||0;return d;});
    setShowMetaForm(null);
  };
  // History: last 6 months of data
  const last6Months=useMemo(()=>{
    const months=[];
    for(let i=5;i>=0;i--){
      let m=selM-i; let y=selY;
      if(m<0){m+=12;y--;}
      const exps=project(data.expenses,m,y);
      const rcvs=project(data.receivables||[],m,y);
      const vaE=exps.filter(e=>e.payType===PT_VA);
      const crE=exps.filter(e=>e.payType===PT_CREDIT);
      const dbE=exps.filter(e=>e.payType===PT_ESTIMATED||e.payType===PT_DEBIT).filter(e=>e.split!=='luisa_pagou'&&e.split!=='100pct_joana');
      const totalCredit=crE.reduce((s,e)=>s+e.amount,0);
      const totalDebit=dbE.reduce((s,e)=>s+e.amount,0);
      const totalVA=vaE.reduce((s,e)=>s+e.amount,0);
      const totalRcv=rcvs.reduce((s,r)=>s+r.amount,0);
      const bycat={};

        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}},
          h(Inp,{label:'Valor (R$)',type:'number',inputMode:'decimal',value:editForm.amount,onChange:e=>setEditForm(f=>({...f,amount:e.target.value}))}),
          h(Inp,{label:'Data',type:'date',value:editForm.date,onChange:e=>setEditForm(f=>({...f,date:e.target.value}))})
        ),
        h(Sel,{label:'Categoria',value:editForm.category,onChange:e=>setEditForm(f=>({...f,category:e.target.value})),style:{marginBottom:12}},
          allCats.map(c=>h('option',{key:c.id,value:c.id},c.icon+' '+c.label))
        ),
        h(Sel,{label:'Forma de pagamento',value:editForm.payType,onChange:e=>setEditForm(f=>({...f,payType:e.target.value})),style:{marginBottom:12}},
          h('option',{value:PT_CREDIT},'💳 Crédito'),
          h('option',{value:PT_DEBIT},'🏦 Débito/PIX'),
          h('option',{value:PT_ESTIMATED},'📋 Estimado'),
          h('option',{value:PT_VA},'🍽️ VA')
        ),
        h(Sel,{label:'Divisão',value:editForm.split,onChange:e=>setEditForm(f=>({...f,split:e.target.value})),style:{marginBottom:14}},
          h('option',{value:'mine'},'💳 Só eu'),
          h('option',{value:'divisivel'},'💑 50/50 — eu paguei'),
          h('option',{value:'luisa_pagou'},'💑 50/50 — Luisa pagou'),
          h('option',{value:'100pct_dela'},'👩 100% dela — eu paguei'),
          h('option',{value:'100pct_joana'},'👩 100% minha — Luisa pagou')
        ),
        h('div',{style:{marginBottom:14}},
          h('div',{style:{fontSize:11,fontWeight:700,color:T.sub,marginBottom:8,textTransform:'uppercase',letterSpacing:.6}},'TIPO'),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}},
            [{v:'once',l:'⚡ Avulso'},{v:'recurring',l:'🔄 Todo mês'},{v:'installment',l:'📅 Parcelado'}].map(t=>
              h('button',{key:t.v,onClick:()=>setEditForm(f=>({...f,type:t.v})),style:{background:editForm.type===t.v?T.accentL:'#f8fffe',border:`2px solid ${editForm.type===t.v?T.accent:T.border}`,borderRadius:12,padding:'10px 6px',fontSize:12,fontWeight:700,color:editForm.type===t.v?T.accent:T.sub,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}},t.l)
            )
          )
        ),
        editForm.type==='installment'&&h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}},
          h(Inp,{label:'Parcela atual',type:'number',value:editForm.iC,onChange:e=>setEditForm(f=>({...f,iC:e.target.value}))}),
          h(Inp,{label:'Total parcelas',type:'number',value:editForm.iT,onChange:e=>setEditForm(f=>({...f,iT:e.target.value}))})
        ),
        h('div',{style:{display:'flex',gap:10}},
          editingExp&&(editingExp.type==='recurring'||editingExp.type==='installment')
            ?h(Fragment,null,
                h(Btn,{onClick:()=>saveEdit('forward'),style:{flex:1,padding:'11px',fontSize:13},v:'primary'},'Daqui pra frente'),
                h(Btn,{onClick:()=>saveEdit('all'),style:{flex:1,padding:'11px',fontSize:13},v:'secondary'},'Todos os meses')
              )
            :h(Btn,{onClick:()=>saveEdit('all'),style:{flex:1,padding:'13px',fontSize:15}},'✓ Salvar alterações'),
          h(Btn,{v:'danger',onClick:()=>{removeExp(editingExp.id);setEditingExp(null);},style:{padding:'13px'}},'🗑️')
        )
      )
    ),
    // META FORM MODAL
    h(BottomSheet,{show:!!showMetaForm,onClose:()=>setShowMetaForm(null),title:showMetaForm==='total'?'🎯 Meta total do mês':'🎯 Meta — '+(allCats.find(c=>c.id===showMetaForm)||{label:''}).label},
      showMetaForm&&h(Fragment,null,
        h('div',{style:{fontSize:13,color:T.muted,marginBottom:16}},MNF[selM]+' '+selY),
        h(Inp,{label:'Limite máximo (R$)',type:'number',inputMode:'decimal',value:metaVal,onChange:e=>setMetaVal(e.target.value),placeholder:'Ex: 2000',style:{marginBottom:18}}),
        h('div',{style:{display:'flex',gap:10}},
          h(Btn,{onClick:()=>saveMetaGoal(showMetaForm==='total'?`total:${selM}:${selY}`:`${showMetaForm}:${selM}:${selY}`),style:{flex:1,padding:'13px',fontSize:15}},'Salvar meta'),
          ((showMetaForm==='total'?getTotalGoal():getGoal(showMetaForm))>0)&&h(Btn,{v:'danger',onClick:()=>{setMetaVal('0');setTimeout(()=>saveMetaGoal(showMetaForm==='total'?`total:${selM}:${selY}`:`${showMetaForm}:${selM}:${selY}`),10);}},'Remover')
        )
      )
    ),
    // EDIT REFUND MODAL
    h(BottomSheet,{show:!!editingRefund,onClose:()=>setEditingRefund(null),title:'✏️ Editar recebimento'},
      editingRefund&&h(Fragment,null,
        h(Inp,{label:'Descrição',value:editRefundForm.name,onChange:e=>setEditRefundForm(f=>({...f,name:e.target.value})),style:{marginBottom:14}}),
        h(Inp,{label:'Valor (R$)',type:'number',inputMode:'decimal',value:editRefundForm.amount,onChange:e=>setEditRefundForm(f=>({...f,amount:e.target.value})),style:{marginBottom:18}}),
        h('div',{style:{background:T.greenL,borderRadius:12,padding:'10px 14px',marginBottom:16,fontSize:13,color:T.green}},
          editingRefund.rcvType==='pix_luisa'?'💑 Pix da Luisa — sobe sua conta':
          editingRefund.rcvType==='estorno'?'↩️ Estorno — abate da fatura':
          '💰 Pix/transferência — sobe sua conta'
        ),
        h('div',{style:{display:'flex',gap:10}},
          h(Btn,{onClick:saveEditRefund,style:{flex:1,padding:'13px',fontSize:15}},'✓ Salvar'),
          h(Btn,{v:'danger',onClick:()=>{removeRefund(editingRefund.id);setEditingRefund(null);}},'🗑️')
        )
      )
    ),
    // TOAST
    showAlert&&h('div',{style:{position:'fixed',top:80,left:'50%',transform:'translateX(-50%)',background:'#1a1d2e',color:'#fff',padding:'10px 20px',borderRadius:99,fontSize:13,fontWeight:700,zIndex:500,whiteSpace:'nowrap',boxShadow:'0 4px 20px rgba(0,0,0,.2)'}},showAlert)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
